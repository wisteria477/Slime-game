name: Godot runtime check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: slime-life-runtime
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static package validation
        run: python3 ci/validate_project.py
      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Parse and import project
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" godot-import.log; then
            echo "Godot script/import errors detected"
            exit 1
          fi
      - name: Boot game for smoke test
        run: |
          set -o pipefail
          code=0
          timeout 12s ./godot --headless --path . --quit-after 3 2>&1 | tee godot-boot.log || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" godot-boot.log; then
            echo "Godot runtime script errors detected"
            exit 1
          fi

      - name: Validate production Nim asset
        run: |
          set -o pipefail
          ./godot --headless --path . --script ci/nim_asset_smoke.gd 2>&1 | tee nim-asset.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|NIM ASSET TEST" nim-asset.log; then
            echo "Production Nim asset test failed"
            exit 1
          fi
          grep -q "NIM V12.1 ASSET SMOKE PASSED" nim-asset.log

      - name: Capture production Nim visual QA
        run: |
          set -o pipefail
          timeout 45s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./godot --path . --rendering-method gl_compatibility --script ci/nim_visual_capture.gd 2>&1 | tee nim-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|NIM VISUAL QA:" nim-visual.log; then
            echo "Production Nim visual capture failed"
            exit 1
          fi
          grep -q "NIM VISUAL QA CAPTURE PASSED" nim-visual.log
          test -s ci/output/nim_visual_qa/nim_idle.png
          test -s ci/output/nim_visual_qa/nim_happy.png
          test -s ci/output/nim_visual_qa/nim_sad.png
          test -s ci/output/nim_visual_qa/nim_tired.png

      - name: Upload Nim visual QA
        uses: actions/upload-artifact@v4
        with:
          name: nim-visual-qa
          path: ci/output/nim_visual_qa/*.png
          if-no-files-found: error

      - name: Exercise household life loop
        run: |
          set -o pipefail
          ./godot --headless --path . --script ci/life_loop_smoke.gd 2>&1 | tee life-loop.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|LIFE LOOP TEST" life-loop.log; then
            echo "Household life-loop test failed"
            exit 1
          fi
          grep -q "SLIME LIFE LIFE-LOOP SMOKE PASSED" life-loop.log
