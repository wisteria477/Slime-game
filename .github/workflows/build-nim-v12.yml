name: Build Nim V12.1 production asset

on:
  push:
    branches:
      - feat/slime-foundation-polish
    paths:
      - .nim-build-trigger

permissions:
  contents: write

concurrency:
  group: nim-v12-1-production-build
  cancel-in-progress: true

jobs:
  build-nim:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slime-foundation-polish
          fetch-depth: 0

      - name: Restore recovered V12.1 source
        run: |
          mkdir -p tools/nim
          gzip -dc tools/nim/build_slime_asset_v12_1.py.gz > tools/nim/build_slime_asset_v12_1.py
          python3 -m py_compile tools/nim/build_slime_asset_v12_1.py

      - name: Download Blender 5.2.2
        run: |
          curl --fail --location --retry 4 --retry-delay 3             https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz             --output blender.tar.xz
          tar -xf blender.tar.xz
          mv blender-5.2.2-linux-x64 blender

      - name: Build and round-trip validate Nim
        run: |
          set -o pipefail
          ./blender/blender --background --factory-startup             --python tools/nim/build_slime_asset_v12_1.py 2>&1 | tee nim-build.log
          grep -q "API PREFLIGHT PASSED" nim-build.log
          grep -q "BODY CONNECTIVITY PASSED" nim-build.log
          grep -q "ANIMATION SMOKE TEST PASSED" nim-build.log
          grep -q "PRE-SAVE VALIDATION PASSED" nim-build.log
          grep -q "GLB ROUND-TRIP VALIDATION PASSED" nim-build.log
          grep -q "FBX ROUND-TRIP VALIDATION PASSED" nim-build.log
          grep -q "POST-EXPORT VALIDATION PASSED" nim-build.log
          grep -q "NIM SLIME V12.1 COMPLETE" nim-build.log

      - name: Install production GLB
        run: |
          test -s "$HOME/NimSlimeOutputV12_1/nim_slime_v12_1.glb"
          mkdir -p assets/models
          cp "$HOME/NimSlimeOutputV12_1/nim_slime_v12_1.glb" assets/models/nim_slime_current.glb

      - name: Commit validated asset and readable source
        run: |
          git config user.name "slime-life-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/nim_slime_current.glb tools/nim/build_slime_asset_v12_1.py
          if git diff --cached --quiet; then
            echo "Validated asset already matches branch."
            exit 0
          fi
          git commit -m "Build validated Nim V12.1 production model"
          git push origin HEAD:feat/slime-foundation-polish
